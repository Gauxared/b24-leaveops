name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Validate documentation and BPMN structure
        run: python tools/verify_docs.py

      - name: Check JavaScript syntax
        run: node --check leaveops/static/app.js

      - name: Download verified PlantUML CLI
        run: |
          curl -fsSL -o /tmp/plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2026.8/plantuml-1.2026.8.jar
          echo "5e1ecfa8ecd32c90b03bbf3b1eb6f020943f98ab0fcf4032be31a0002ee2c462  /tmp/plantuml.jar" | sha256sum --check

      - name: Check PlantUML syntax
        shell: bash
        run: |
          set -euo pipefail
          find docs/diagrams/src -name '*.puml' ! -name 'theme.puml' -print0 |
            xargs -0 java -jar /tmp/plantuml.jar --check-syntax
